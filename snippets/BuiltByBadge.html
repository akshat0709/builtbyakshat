<a
  href="https://builtby.akshatgupta.dev"
  target="_blank"
  rel="noopener"
  style="
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12px;
    font-weight: 600;
    color: #1a1a1a;
    background-color: #fff6e5;
    border: 2px solid #1a1a1a;
    border-radius: 9999px;
    box-shadow: 2px 2px 0px #1a1a1a;
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  "
  onmouseover="this.style.transform='translate(-1px, -1px)'; this.style.boxShadow='3px 3px 0px #1a1a1a';"
  onmouseout="this.style.transform='translate(0px, 0px)'; this.style.boxShadow='2px 2px 0px #1a1a1a';"
>
  <span style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; background-color: #ff4336;"></span>
  <span>Built by Akshat Gupta</span>
